[package]
name = "cnctd_server"
version = "1.0.0-alpha.1"
edition = "2021"
authors = ["Connected Dot Inc.", "Kyle Ebner <kyle@cnctd.world>"]
description = "HTTP + WebSocket server framework for Connected Dot services (axum)"
repository = "https://github.com/Connected-Dot/cnctd_server"
license = "MIT"
keywords = ["module"]

[features]
default = []

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hmac = "0.12"
jwt = "0.16"
local-ip-address = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
sha2 = "0.10"
sys-info = "0.9"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# The behavioral suite in tests/ drives real servers over HTTP and WebSocket.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tokio-tungstenite = "0.26"
tokio-stream = "0.1"
tempfile = "3"
